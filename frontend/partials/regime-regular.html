<section class="row justify-content-center" aria-label="Calculadora Regime Regular RTC">
  <div class="col-lg-9">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h2 class="h6 mb-0 fw-bold">
          <i class="bi bi-building-gear text-primary me-2"></i>Calculadora Regime Regular (IBS / CBS / IS)
        </h2>
        <span class="badge text-bg-primary">POST /api/v1/regime-regular/calcular</span>
      </div>
      <div class="card-body">
        <form id="regimeRegularForm" class="row g-3">
          <div class="col-md-4">
            <label for="valor_operacao_rr" class="form-label">Valor da Operação (R$)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="valor_operacao_rr" name="valor_operacao" value="1000.00" required />
          </div>
          <div class="col-md-4">
            <label for="aliquota_ibs_uf" class="form-label">Alíquota IBS Estadual (%)</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" id="aliquota_ibs_uf" name="aliquota_ibs_uf" value="10.00" required />
          </div>
          <div class="col-md-4">
            <label for="aliquota_ibs_mun" class="form-label">Alíquota IBS Municipal (%)</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" id="aliquota_ibs_mun" name="aliquota_ibs_mun" value="7.00" required />
          </div>
          <div class="col-md-3">
            <label for="aliquota_cbs" class="form-label">Alíquota CBS (%)</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" id="aliquota_cbs" name="aliquota_cbs" value="8.80" required />
          </div>
          <div class="col-md-3">
            <label for="aliquota_is" class="form-label">Alíquota IS (%)</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" id="aliquota_is" name="aliquota_is" value="0.00" required />
          </div>
          <div class="col-md-3">
            <label for="percentual_reducao" class="form-label">Redução (%)</label>
            <input type="number" step="0.01" min="0" max="100" class="form-control" id="percentual_reducao" name="percentual_reducao" value="0.00" required />
          </div>
          <div class="col-md-3">
            <label for="creditos_anteriores" class="form-label">Créditos (R$)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="creditos_anteriores" name="creditos_anteriores" value="0.00" required />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-calculator me-1"></i>Calcular Regime Regular
            </button>
          </div>
        </form>

        <div id="regimeRegularResult" class="mt-4"></div>
      </div>
    </div>
  </div>
</section>
